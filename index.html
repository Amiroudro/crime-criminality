const SC=[["Classical","<p>18th-century reaction to arbitrary justice; crime violates the <b>social contract</b>. <span class='chip'>Beccaria</span> free will, swift and proportionate punishment. <span class='chip'>Bentham</span> pain–pleasure, greatest happiness.</p><ul><li>Free, rational, hedonistic humans; crime when benefit &gt; cost.</li><li>Equal punishment; aim is <b>deterrence</b>; against the death penalty.</li></ul><p><b>Critique:</b> ignores socio-economic factors and individual differences; no rehabilitation; focus on law, not crime control.</p>",`<svg viewBox="0 0 300 170"><g class="bm"><animateTransform attributeName="transform" attributeType="XML" type="rotate" values="6 150 70;-6 150 70;6 150 70" dur="6s" repeatCount="indefinite"/><rect x="30" y="66" width="240" height="8" rx="4" fill="#3a1510"/><rect x="40" y="26" width="76" height="40" rx="10" class="b"/><text x="78" y="51" class="w">BENEFIT</text><rect x="190" y="38" width="70" height="28" rx="10" class="y"/><text x="225" y="57">COST</text></g><path class="l" d="M150 74v70M110 150h80"/><text x="150" y="14">Crime when benefit &gt; cost</text></svg>`,"Rational choice"],
["Pre-classical","<p>Crime explained by <b>demonology, witchcraft and supernatural powers</b>; remedies were worship, sacrifice, <b>trial by ordeal</b> (water, fire) and torture by priests. Reformers (Hobbes, Locke, St Thomas, Luther) challenged it.</p>"],
["Biological","<p>Positivists reject free will for <b>determinism</b>. <span class='chip'>Lombroso</span><span class='chip'>Ferri</span><span class='chip'>Garofalo</span></p><ul><li>“Born” criminal; <b>atavism and degeneracy</b>.</li><li>Traits: asymmetrical face, large ears, long arms, flat nose, retreating forehead.</li><li>Crime = personality × environment.</li><li>Treatment over punishment: <b>indeterminate sentencing, incapacitation, forced sterilisation</b>.</li></ul><p><b>Limits:</b> overgeneralisation, no crime gene, ignores society, stigmatises.</p>"+F(TWIN,"Twin studies separate heredity from environment"),`<svg viewBox="0 0 300 150">${[[50,13,"Ectomorph"],[150,22,"Mesomorph"],[250,32,"Endomorph"]].map(([x,w,n],i)=>`<circle cx="${x}" cy="22" r="12" class="a"/><rect x="${x-w}" y="38" width="${w*2}" height="62" rx="${w}" class="${["y","b","pp"][i]}"/><rect x="${x-w/2.5}" y="98" width="${w/1.2}" height="32" rx="6" fill="#3a1510"/><text x="${x}" y="146">${n}</text>`).join("")}</svg>`,"Body types (somatotypes)"],
["Psychological","<p>Personality defects, feeble-mindedness, mental disorder, undeveloped ego.</p>"+T(["Theory","Cause"],[["Psychodynamic (Freud)","Id–ego–superego, Oedipal conflict, death instinct"],["Behavioural / social learning","Imitation, observation, reward and punishment"],["Cognitive","Faulty decisions, weak moral reasoning, rationalising"],["Personality (Eysenck)","Extraversion, neuroticism, psychoticism"],["Intelligence","Low IQ, poor schooling"]])+"<p>Behaviour can be modified by counselling, education and treatment.</p>"],
["Economic","<p><span class='chip'>Becker</span> crime when expected benefits exceed costs. <span class='chip'>Fornasari 1894</span> 85–90% of Italian criminals poor: a “climate of motivation”. <span class='chip'>Bonger</span> capitalism breeds egoism. <span class='chip'>Marxian</span> gap between effort and reward, class inequality.</p><p><b>Limits:</b> monolithic, oversimplified.</p>"],
["Geographical","<p><span class='chip'>Montesquieu</span><span class='chip'>Quetelet</span><span class='chip'>Guerry</span><span class='chip'>Dexter</span><span class='chip'>Kropotkin</span></p><ul><li>Climate, regions, cities shape crime; unequal distribution.</li><li>Urbanisation, overcrowding, weak surveillance.</li><li>Prevention: lighting, surveillance, environmental design.</li></ul>"],
["Sociological","<p>Rejects inheritance; crime is <b>learned</b>. Four approaches: social disorganisation, structural, processual, sub-cultural.</p>"+T(["Theory","Core idea","Lecture example"],[["Social disorganisation","Congestion, poor housing, weak control","Mohammadpur–Bihari colony"],["Differential association (Sutherland)","Learned in intimate groups; frequency, duration, priority, intensity","Dowry, stealing, exam cheating"],["Anomie","Normlessness, little moral guidance","Mob violence, vandalism, arson"],["Strain (Merton)","Blocked goals → illegitimate means","Bribery, theft, embezzlement"],["Labelling (Becker)","Deviance is a social label","—"]]),`<svg viewBox="0 0 300 190"><circle cx="150" cy="95" r="88" class="s"/><circle cx="150" cy="95" r="66" class="b" opacity=".4"/><circle cx="150" cy="95" r="44" class="y"/><circle cx="150" cy="95" r="22" class="a"/><text x="150" y="99" class="w">Centre</text><text x="150" y="62">Delinquency area</text><text x="150" y="38">Stable residential</text></svg>`,"Illustrative zone model"]];

crime:()=>`<section class="hero" style="padding-bottom:0"><div class="eb">Unit 1</div><h1>What is crime?</h1></section>
<div class="card rv" style="margin-top:20px">Latin <i>crimen</i>: fault, offence, guilt. <b>Tannenbaum:</b> crime is as eternal as society. <b>Alfieri:</b> society prepares crimes, the criminal commits them. <b>Quinney:</b> crime reflects material and spiritual conditions of society. Crime is <b>relative</b> (Section 377 example in the lecture).</div>
<div class="grid rv"><div class="card"><h3>Social definitions</h3><ul><li><b>Sellin 1970:</b> violation of group conduct norms</li><li><b>Caldwell 1956:</b> detrimental to society; organised, tested procedures</li><li><b>Clinard 1957:</b> tolerated, mildly or strongly disapproved; the last is crime</li><li><b>Strain theorists:</b> dysfunctional</li></ul></div><div class="card"><h3>Legal definitions</h3><ul><li><b>Tappon 1960:</b> intentional act or omission, no justification, state-sanctioned</li><li><b>Hall Jerome 1947:</b> forbidden, harmful, criminal intent, prescribed punishment</li><li><b>Marxists / Becker:</b> law as social creation; labelling</li></ul></div></div>
<div class="pn mr rv"><h2>Actus reus + mens rea = crime</h2>
<div class="crime-elements" role="group" aria-label="The two elements commonly required for criminal liability">
  <div class="crime-element"><span class="crime-element-kicker">ELEMENT 1</span><h3>Actus reus</h3><b>Guilty act</b><p>The prohibited conduct, omission or consequence required by the offence.</p><small>Ask: What happened?</small></div>
  <div class="crime-combine" aria-hidden="true"><span>+</span><i></i><span>=</span></div>
  <div class="crime-element mind"><span class="crime-element-kicker">ELEMENT 2</span><h3>Mens rea</h3><b>Guilty mind</b><p>The required mental state, such as intention, knowledge, recklessness or negligence.</p><small>Ask: What was the person's state of mind?</small></div>
</div>
<div class="crime-result"><b>Criminal liability</b><span>Both elements must be established, subject to the wording of the offence, causation rules, defences and other legal requirements.</span></div>
<p class="crime-note">Remember: not every offence requires the same mental element. Some offences impose strict or absolute liability.</p>
</div>
<div class="grid rv">${F(`<svg viewBox="0 0 300 190"><circle cx="110" cy="80" r="62" class="y" opacity=".8"/><circle cx="190" cy="80" r="62" class="pp" opacity=".8"/><circle cx="150" cy="130" r="62" class="b" opacity=".6"/><text x="80" y="70">CRIME</text><text x="220" y="70">SIN</text><text x="150" y="150">IMMORALITY</text></svg>`,"Law · faith · social norms")}<div class="card">${T(["","Crime","Sin","Immoral"],[["By","Law","Faith","Norms"],["Punish","Physical","Earthly + hereafter","Scolding"],["E.g.","Homicide","Usury","Public urination"]])}</div></div>
<div class="card rv"><b>Types (Clinard &amp; Quinney 1967):</b> <span class="chip">Violent personal</span><span class="chip">Occasional property</span><span class="chip">Occupational</span><span class="chip">Political</span><span class="chip">Public order</span><span class="chip">Conventional</span><p><b>Significance:</b> fear and loss · public fascination · costly · erodes morale · reflects social ills · stigmatises offenders.</p></div>`,
criminology:()=>`<section class="hero" style="padding-bottom:0"><div class="eb">Unit 2</div><h1>Criminology</h1></section>
<div class="card rv" style="margin-top:20px"><b>Bloch &amp; Geis:</b> science of crime as a social phenomenon. <b>Sutherland:</b> making laws, breaking laws, reacting to law-breaking. <b>Penology:</b> the punitive branch.</div>
<figure class="motion rv"><svg viewBox="0 0 320 160" role="img" aria-label="Criminology connects biology, psychology and sociology"><circle cx="160" cy="80" r="27" fill="#3a1510" class="pulse"/><text x="160" y="84" fill="#fff">Crime</text><g class="spin"><circle cx="160" cy="80" r="65" fill="none" stroke="#a3837a" stroke-width="2" stroke-dasharray="5 6"/></g><circle cx="160" cy="15" r="18" fill="#2f9e7c"/><circle cx="103" cy="113" r="18" fill="#f7b6ee"/><circle cx="217" cy="113" r="18" fill="#f7de8b"/><text x="160" y="19" font-size="8">BIO</text><text x="103" y="117" font-size="8">PSY</text><text x="217" y="117" font-size="8">SOC</text></svg><figcaption>Criminology draws on biological, psychological and sociological knowledge</figcaption></figure><div class="grid rv"><div class="card" style="background:var(--y);color:#1a1210;border:0"><h3>Traft’s 4 divisions</h3><p>1 Explanation · 2 Detection · 3 Prevention · 4 Punishment and treatment</p></div><div class="card"><h3>A science</h3><p>Verifiable, accurate, systematic, objective, controlled, theory and research. Draws on <b>biology, psychology, sociology</b>.</p></div></div>
<div class="pn mr rv"><h2>Evolution</h2><div class="tl"><div><b>1879</b>Topinard: “criminologie”</div><div><b>18–19th c.</b>Reform of criminal law</div><div><b>1920</b>Parmelee’s textbook</div><div><b>1940</b>Lucknow teaching</div><div><b>1949</b>Lucknow diploma</div></div></div>

const QZ=[["Who first used “criminologie” (1879)?",["Lombroso","Paul Topinard","Sutherland","Becker"],1,"Topinard, French anthropologist."],["Which school stressed free will and swift, proportionate punishment?",["Classical","Positivist","Pre-classical","Radical"],0,"Beccaria and Bentham."],["Lombroso’s central idea?",["Anomie","Born criminal type","Social contract","Labelling"],1,"Atavism and degeneracy."],["Actus reus means…",["Guilty mind","Guilty act","Intent","Defence"],1,"Mens rea is the guilty mind."],["Who defined crime as an act or omission sanctioned as felony or misdemeanour?",["Sellin","Caldwell","Tappon","Quinney"],2,"Paul Tappon, 1960."],["Which perspective sees criminals as victims of capitalism?",["Liberal","Radical","Conservative","Classical"],1,"Radical criminology."],["Delinquency areas relate to…",["Differential association","Social disorganisation","Strain","Cognitive theory"],1,"Congestion, poor housing, weak control."],["Blocked goals and illegitimate means describe…",["Strain","Labelling","Psychodynamic","Geographical"],0,"Merton’s strain."],["Penology deals with…",["Detection","Punishment","Victims","Law-making"],1,"The punitive aspects."],["Bonger linked crime to…",["Climate","Capitalism and egoism","Heredity","Imitation"],1,"Less altruism, more egoism."],["Differential association was developed by…",["Sutherland","Becker","Merton","Eysenck"],0,"Crime is learned in intimate groups."],["Gibbons &amp; Garabedian’s perspectives…",["Classical, positivist, radical","Liberal, radical, conservative","Biological, social, legal","Old, new, modern"],1,"1974."]];
const FC=[["Crimen","Latin: fault, offence, guilt"],["Tannenbaum","Crime is as eternal as society"],["Alfieri","Society prepares crimes, the criminal commits them"],["Clinard 1957","Tolerated, mildly or strongly disapproved; the last is crime"],["Mens rea / Actus reus","Guilty mind / guilty act"],["Sutherland","Making, breaking, reacting to laws"],["Traft","Explanation · detection · prevention · punishment"],["Beccaria","Free will, proportionate and swift punishment"],["Bentham","Pain–pleasure; greatest happiness"],["Lombroso","Born criminal; atavism"],["Fornasari 1894","85–90% of Italian criminals poor"],["Bonger","Capitalism breeds egoism"],["Liberal","1940–50: environment; rehabilitation"],["Radical","1960–70: capitalism; change system"],["Conservative","1970–90: moral defect; deterrence"],["Sociological approaches","Disorganisation · structural · processual · sub-cultural"]];

function toggleHeroTrace(){const h=document.getElementById("homeHero");if(!h)return;const active=h.classList.toggle("tracing");const b=h.querySelector(".hero-trace");if(b){b.setAttribute("aria-pressed",String(active));b.innerHTML=active?"Connections highlighted <span aria-hidden=\"true\">✓</span>":"Trace the connections <span aria-hidden=\"true\">↗</span>";}}
function moveHeroBackdrop(e){const h=e.currentTarget,r=h.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;h.style.setProperty("--hx",(x*-16)+"px");h.style.setProperty("--hy",(y*-12)+"px");}
let cigaretteTrailCleanup=null;
function initCigaretteTrail(){
  if(cigaretteTrailCleanup)cigaretteTrailCleanup();
  const canvas=document.getElementById("cigaretteTrail");
  if(!canvas||!canvas.getContext||window.matchMedia("(prefers-reduced-motion: reduce)").matches||window.matchMedia("(hover: none), (pointer: coarse)").matches)return;
  /* Keep the cursor layer outside the hero so overflow/stacking contexts cannot clip it. */
  if(canvas.parentElement!==document.body)document.body.appendChild(canvas);
  const ctx=canvas.getContext("2d");if(!ctx)return;
  let w=0,h=0,raf=0,active=false,hasPoint=false,lastEmit=0;
  let pointer={x:0,y:0,vx:0,vy:0,angle:0},last={x:0,y:0};
  const particles=[];
  function resize(){const dpr=Math.min(window.devicePixelRatio||1,1.6);w=window.innerWidth;h=window.innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
  function addSmoke(){
    for(let i=0;i<2;i++)particles.push({x:pointer.x+(Math.random()-.5)*5,y:pointer.y+(Math.random()-.5)*5,vx:pointer.vx*.035+(Math.random()-.5)*.45,vy:-.45-Math.random()*.55,size:4+Math.random()*5,life:1,decay:.009+Math.random()*.008,wobble:Math.random()*6.28});
    if(particles.length>140)particles.splice(0,particles.length-140);
  }
  function drawCigarette(){
    ctx.save();ctx.translate(pointer.x,pointer.y);ctx.rotate(pointer.angle);
    ctx.shadowColor="rgba(0,0,0,.22)";ctx.shadowBlur=5;ctx.shadowOffsetY=2;
    ctx.fillStyle="#f0dfc5";ctx.beginPath();ctx.roundRect(-68,-3.2,68,6.4,3);ctx.fill();
    ctx.shadowColor="transparent";ctx.fillStyle="#bd8552";ctx.fillRect(-68,-3.2,16,6.4);
    ctx.fillStyle="#f8eee0";ctx.fillRect(-52,-3.2,47,6.4);
    ctx.strokeStyle="rgba(100,70,50,.35)";ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(-52,-3);ctx.lineTo(-52,3);ctx.stroke();
    ctx.fillStyle="#dc542c";ctx.beginPath();ctx.arc(-1,0,3.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#ffcf6a";ctx.beginPath();ctx.arc(-1,0,1.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  function frame(){
    ctx.clearRect(0,0,w,h);
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];p.wobble+=.035;p.x+=p.vx+Math.sin(p.wobble)*.22;p.y+=p.vy;p.vx*=.992;p.vy-=.002;p.size+=.045;p.life-=p.decay;
      if(p.life<=0){particles.splice(i,1);continue}
      const a=Math.min(.22,p.life*.19);
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*2.8);
      g.addColorStop(0,"rgba(105,105,105,"+a+")");g.addColorStop(.55,"rgba(125,125,125,"+(a*.48)+")");g.addColorStop(1,"rgba(125,125,125,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size*2.8,0,Math.PI*2);ctx.fill();
    }
    if(active&&hasPoint)drawCigarette();
    if(active||particles.length){raf=requestAnimationFrame(frame)}
    else{raf=0;ctx.clearRect(0,0,w,h);canvas.classList.remove("active")}
  }
  function wake(){if(!raf)raf=requestAnimationFrame(frame);canvas.classList.add("active")}
  function move(e){
    const x=e.clientX,y=e.clientY;
    pointer.vx=x-last.x;pointer.vy=y-last.y;
    if(Math.abs(pointer.vx)+Math.abs(pointer.vy)>0)pointer.angle=Math.max(-.45,Math.min(.45,Math.atan2(pointer.vy,pointer.vx)*.28));
    pointer.x=x+16;pointer.y=y+14;last={x,y};hasPoint=true;active=true;
    const now=performance.now();if(now-lastEmit>24){addSmoke();lastEmit=now}
    wake();
  }
  function leave(){active=false;wake()}
  resize();window.addEventListener("resize",resize,{passive:true});
  window.addEventListener("pointermove",move,{passive:true});
  window.addEventListener("pointerleave",leave,{passive:true});
  cigaretteTrailCleanup=()=>{active=false;hasPoint=false;window.removeEventListener("resize",resize);window.removeEventListener("pointermove",move);window.removeEventListener("pointerleave",leave);if(raf)cancelAnimationFrame(raf);ctx.clearRect(0,0,w,h);canvas.classList.remove("active");cigaretteTrailCleanup=null;};
}
