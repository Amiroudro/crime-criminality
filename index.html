const P=[["home","Home"],["crime","Crime"],["criminology","Criminology"],["schools","Schools"],["exam","Essays"],["quiz","Quiz"],["cards","Cards"]];

const AV=(bg,sk,top,hr,hat)=>`<svg class="av" viewBox="0 0 200 240"><rect width="200" height="240" fill="${bg}"/><circle cx="165" cy="45" r="40" fill="#fff" opacity=".35"/><path d="M0 240v-34q0-40 62-48h76q62 8 62 48v34z" fill="${top}"/><path d="M0 240q30-60 70-62l-14 62z" fill="#e8412f" opacity=".8"/><rect x="86" y="128" width="28" height="30" fill="${sk}"/><ellipse cx="100" cy="98" rx="38" ry="46" fill="${sk}"/><path d="M62 92q0-54 38-54t38 54q-12-28-38-28T62 92z" fill="${hr}"/>${hat?`<path d="M54 76q46-62 92 0z" fill="${hat}"/><rect x="46" y="74" width="108" height="9" rx="4" fill="${hat}"/>`:""}<circle cx="86" cy="104" r="3" fill="#222"/><circle cx="114" cy="104" r="3" fill="#222"/><path d="M90 122q10 9 20 0" stroke="#222" fill="none" stroke-width="3" stroke-linecap="round"/></svg>`;
const TH=[["Cesare Beccaria","Classical · free will, swift punishment",AV("#f7de8b","#e8b48a","#2f9e7c","#2a1a14")],["Jeremy Bentham","Classical · pain–pleasure principle",AV("#9db8f2","#f0c8a0","#e8412f","#d8d8d8")],["Cesare Lombroso","Positivist · the born criminal",AV("#f8a98b","#e9b98f","#1f3b8f","#4a3a30","#2f9e7c")],["Edwin Sutherland","Differential association",AV("#f7b6ee","#c98f68","#f2a431","#1a1210")],["Robert Merton","Strain · anomie",AV("#bfe3d0","#8d5a3b","#6d3fc4","#111")],["Howard Becker","Labelling theory",AV("#f7de8b","#f0c8a0","#1a1210","#7a5a3a","#e8412f")]];
const SC=[["Classical","<p>18th-century reaction to arbitrary justice; crime violates the <b>social contract</b>. <span class='chip'>Beccaria</span> free will, swift and proportionate punishment. <span class='chip'>Bentham</span> pain–pleasure, greatest happiness.</p><ul><li>Free, rational, hedonistic humans; crime when benefit &gt; cost.</li><li>Equal punishment; aim is <b>deterrence</b>; against the death penalty.</li></ul><p><b>Critique:</b> ignores socio-economic factors and individual differences; no rehabilitation; focus on law, not crime control.</p>",`<svg viewBox="0 0 300 170"><g class="bm"><rect x="30" y="66" width="240" height="8" rx="4" fill="#3a1510"/><rect x="40" y="26" width="76" height="40" rx="10" class="b"/><text x="78" y="51" class="w">BENEFIT</text><rect x="190" y="38" width="70" height="28" rx="10" class="y"/><text x="225" y="57">COST</text></g><path class="l" d="M150 74v70M110 150h80"/><text x="150" y="14">Crime when benefit &gt; cost</text></svg>`,"Rational choice"],
["Pre-classical","<p>Crime explained by <b>demonology, witchcraft and supernatural powers</b>; remedies were worship, sacrifice, <b>trial by ordeal</b> (water, fire) and torture by priests. Reformers (Hobbes, Locke, St Thomas, Luther) challenged it.</p>"],
["Biological","<p>Positivists reject free will for <b>determinism</b>. <span class='chip'>Lombroso</span><span class='chip'>Ferri</span><span class='chip'>Garofalo</span></p><ul><li>“Born” criminal; <b>atavism and degeneracy</b>.</li><li>Traits: asymmetrical face, large ears, long arms, flat nose, retreating forehead.</li><li>Crime = personality × environment.</li><li>Treatment over punishment: <b>indeterminate sentencing, incapacitation, forced sterilisation</b>.</li></ul><p><b>Limits:</b> overgeneralisation, no crime gene, ignores society, stigmatises.</p>"+F(TWIN,"Twin studies separate heredity from environment"),`<svg viewBox="0 0 300 150">${[[50,13,"Ectomorph"],[150,22,"Mesomorph"],[250,32,"Endomorph"]].map(([x,w,n],i)=>`<circle cx="${x}" cy="22" r="12" class="a"/><rect x="${x-w}" y="38" width="${w*2}" height="62" rx="${w}" class="${["y","b","pp"][i]}"/><rect x="${x-w/2.5}" y="98" width="${w/1.2}" height="32" rx="6" fill="#3a1510"/><text x="${x}" y="146">${n}</text>`).join("")}</svg>`,"Body types (somatotypes)"],
["Psychological","<p>Personality defects, feeble-mindedness, mental disorder, undeveloped ego.</p>"+T(["Theory","Cause"],[["Psychodynamic (Freud)","Id–ego–superego, Oedipal conflict, death instinct"],["Behavioural / social learning","Imitation, observation, reward and punishment"],["Cognitive","Faulty decisions, weak moral reasoning, rationalising"],["Personality (Eysenck)","Extraversion, neuroticism, psychoticism"],["Intelligence","Low IQ, poor schooling"]])+"<p>Behaviour can be modified by counselling, education and treatment.</p>"],
["Economic","<p><span class='chip'>Becker</span> crime when expected benefits exceed costs. <span class='chip'>Fornasari 1894</span> 85–90% of Italian criminals poor: a “climate of motivation”. <span class='chip'>Bonger</span> capitalism breeds egoism. <span class='chip'>Marxian</span> gap between effort and reward, class inequality.</p><p><b>Limits:</b> monolithic, oversimplified.</p>"],
["Geographical","<p><span class='chip'>Montesquieu</span><span class='chip'>Quetelet</span><span class='chip'>Guerry</span><span class='chip'>Dexter</span><span class='chip'>Kropotkin</span></p><ul><li>Climate, regions, cities shape crime; unequal distribution.</li><li>Urbanisation, overcrowding, weak surveillance.</li><li>Prevention: lighting, surveillance, environmental design.</li></ul>"],
["Sociological","<p>Rejects inheritance; crime is <b>learned</b>. Four approaches: social disorganisation, structural, processual, sub-cultural.</p>"+T(["Theory","Core idea","Lecture example"],[["Social disorganisation","Congestion, poor housing, weak control","Mohammadpur–Bihari colony"],["Differential association (Sutherland)","Learned in intimate groups; frequency, duration, priority, intensity","Dowry, stealing, exam cheating"],["Anomie","Normlessness, little moral guidance","Mob violence, vandalism, arson"],["Strain (Merton)","Blocked goals → illegitimate means","Bribery, theft, embezzlement"],["Labelling (Becker)","Deviance is a social label","—"]]),`<svg viewBox="0 0 300 190"><circle cx="150" cy="95" r="88" class="s"/><circle cx="150" cy="95" r="66" class="b" opacity=".4"/><circle cx="150" cy="95" r="44" class="y"/><circle cx="150" cy="95" r="22" class="a"/><text x="150" y="99" class="w">Centre</text><text x="150" y="62">Delinquency area</text><text x="150" y="38">Stable residential</text></svg>`,"Illustrative zone model"]];
const pages={
home:()=>`<section class="hero"><div class="eb">In-course exam studio</div><h1>Ace Crime &amp; Criminality<br>the smart way</h1><p>From concept to confidence: every lecture, theory and thinker, turned into diagrams, essay plans and practice.</p><a class="btn k" href="#schools">Start revising</a>
<div class="stage"><div class="fl x" style="left:2%;top:250px;background:var(--y);animation-delay:-1s"><span>Engagement</span><b>40%</b></div><div class="fl x" style="left:8%;top:50px;background:#fff"><span class="eb">Lecture 3</span><br><b style="font-size:28px">7 schools</b></div><div class="fl" style="right:3%;top:30px;background:var(--s);animation-delay:-2s"><b>4</b>essay plans<br><span class="tg" style="margin-top:6px">12 quiz Qs</span></div><div class="fl x" style="right:6%;top:240px;background:var(--g);color:#fff;animation-delay:-3s"><span>UP TO</span><b>20X</b>faster revision</div>
<div class="ph"><span class="live">● Live</span>${TH[0][2]}<div class="cap"><b>Cesare Beccaria</b>Classical school · free will and deterrence</div></div></div></section>
<section class="rv"><div class="eb">Thinkers who shaped the field</div><h2>People behind the theories</h2><div class="row">${TH.map(t=>`<div class="th">${t[2]}<b>${t[0]}</b><small>${t[1]}</small></div>`).join("")}</div>
<div class="logos">${["Classical","Positivist","Psychological","Economic","Geographical","Sociological"].map((x,i)=>`<div style="font-family:${["Georgia","Inter","ui-monospace","Newsreader","Inter","Georgia"][i]},serif">${x}</div>`).join("")}</div></section>
<section class="pn mr rv" style="padding:40px 30px;margin-top:40px"><span class="tg">// About the course //</span><p class="big" style="max-width:640px">Criminology studies crime as a social phenomenon: <span>how laws are made, how they are broken, and how society reacts.</span> It draws on biology, psychology and sociology.</p><div style="display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:20px;margin-top:40px"><div><div class="sf" style="font-size:54px">3 questions · 2 answers</div><p class="mu">Your exam: about 4 pages each.</p></div><a class="btn w" href="#exam">See essay plans</a></div></section>
<section class="q rv"><div>${TH[3][2]}</div><div class="big">“Crime is eternal, as eternal as society.”<br><span class="mu" style="font-size:15px;font-family:Inter">— Frank Tannenbaum</span></div><div class="n">2<div class="eb">pillars of criminal liability</div></div></section>
<section class="rv"><div class="eb">Evolution of thought</div><h2>Timeline of schools</h2><div class="card"><div class="tl"><div><b>Pre-classical</b>Demonology, ordeals</div><div><b>18th c. Classical</b>Beccaria, Bentham</div><div><b>19th c. Positivist</b>Lombroso, Ferri</div><div><b>Sociological</b>Differential association, strain</div><div><b>1940–90</b>Liberal, radical, conservative</div></div></div></section>
<section class="rv"><div class="eb">Explore</div><h2>Choose your path</h2><div class="grid">${[["crime","Crime","Definitions, actus reus, types","var(--y)"],["criminology","Criminology","Science, evolution, perspectives","var(--s)"],["schools","Schools","Classical to sociological","var(--p)"],["quiz","Quiz","12 questions","var(--bl)"]].map(x=>`<a class="card" style="background:${x[3]};color:#1a1210;border:0" href="#${x[0]}"><h3>${x[1]}</h3><p>${x[2]}</p><b>Open →</b></a>`).join("")}</div></section>
<section class="pn mr tm rv" style="padding:36px 30px;margin-top:30px"><div><h2 style="margin-top:0">Don’t take our word for it.</h2><p class="big" style="font-size:22px"><span>Answer 2 of 3 questions, about 4 pages each.</span> Structure every essay as definition → thinkers with years → 4–6 developed points → critique → conclusion.</p></div><div class="in2"><b style="font-size:18px">Your revision kit</b><div class="st"><div><b>12</b><small>QUIZ QUESTIONS</small></div><div><b>16</b><small>FLASHCARDS</small></div><div><b>4</b><small>ESSAY PLANS</small></div></div><a class="btn k" href="#quiz">Take the quiz</a> <a class="btn" href="#cards">Flashcards</a></div></section>`,
crime:()=>`<section class="hero" style="padding-bottom:0"><div class="eb">Unit 1</div><h1>What is crime?</h1></section>
<div class="card rv" style="margin-top:20px">Latin <i>crimen</i>: fault, offence, guilt. <b>Tannenbaum:</b> crime is as eternal as society. <b>Alfieri:</b> society prepares crimes, the criminal commits them. <b>Quinney:</b> crime reflects material and spiritual conditions of society. Crime is <b>relative</b> (Section 377 example in the lecture).</div>
<div class="grid rv"><div class="card"><h3>Social definitions</h3><ul><li><b>Sellin 1970:</b> violation of group conduct norms</li><li><b>Caldwell 1956:</b> detrimental to society; organised, tested procedures</li><li><b>Clinard 1957:</b> tolerated, mildly or strongly disapproved; the last is crime</li><li><b>Strain theorists:</b> dysfunctional</li></ul></div><div class="card"><h3>Legal definitions</h3><ul><li><b>Tappon 1960:</b> intentional act or omission, no justification, state-sanctioned</li><li><b>Hall Jerome 1947:</b> forbidden, harmful, criminal intent, prescribed punishment</li><li><b>Marxists / Becker:</b> law as social creation; labelling</li></ul></div></div>
<div class="pn mr rv"><h2>Actus reus + mens rea = crime</h2><div style="display:flex;gap:12px;flex-wrap:wrap"><span class="chip">Guilty act</span><span class="chip" style="background:var(--p)">Guilty mind</span></div><p class="mu">Mens rea: intention, knowledge, recklessness, negligence. Defences: involuntary conduct, factual disputes, lack of intent, intoxication and mental health.</p></div>
<div class="grid rv">${F(`<svg viewBox="0 0 300 190"><circle cx="110" cy="80" r="62" class="y" opacity=".8"/><circle cx="190" cy="80" r="62" class="pp" opacity=".8"/><circle cx="150" cy="130" r="62" class="b" opacity=".6"/><text x="80" y="70">CRIME</text><text x="220" y="70">SIN</text><text x="150" y="150">IMMORALITY</text></svg>`,"Law · faith · social norms")}<div class="card">${T(["","Crime","Sin","Immoral"],[["By","Law","Faith","Norms"],["Punish","Physical","Earthly + hereafter","Scolding"],["E.g.","Homicide","Usury","Public urination"]])}</div></div>
