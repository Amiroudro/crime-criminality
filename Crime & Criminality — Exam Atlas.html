<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crime &amp; Criminality — Exam Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ee;--sf:#fff;--tx:#14141c;--mu:#5d5d6b;--ac:#6d28d9;--ac2:#0e9f94;--gd:#c28a1e;--bd:#e4dfd3;--ok:#15803d;--no:#b91c1c;--hero:linear-gradient(135deg,#1a1040,#3b1d8f 55%,#0e7a78);--sh:0 10px 30px rgba(30,20,60,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b14;--sf:#15151f;--tx:#eeeef5;--mu:#a2a2b4;--ac:#a78bfa;--ac2:#2dd4bf;--gd:#fbbf24;--bd:#272736;--ok:#4ade80;--no:#f87171;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b14;--sf:#15151f;--tx:#eeeef5;--mu:#a2a2b4;--ac:#a78bfa;--ac2:#2dd4bf;--gd:#fbbf24;--bd:#272736;--ok:#4ade80;--no:#f87171;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,"Times New Roman",serif;line-height:1.15}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--bd);display:flex;gap:2px;padding:10px 14px;overflow-x:auto;align-items:center}
nav b{font-family:Fraunces,Georgia,serif;margin-right:12px;white-space:nowrap;color:var(--ac)}
nav a{white-space:nowrap;padding:7px 13px;border-radius:99px;color:var(--mu);text-decoration:none;font-size:14px;font-weight:600;transition:.2s}
nav a:hover{color:var(--tx)}nav a.on{background:var(--ac);color:#fff}
nav button{margin-left:auto;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:99px;padding:6px 11px;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:0 18px 90px}
.hero{margin:18px -4px 0;border-radius:28px;background:var(--hero);color:#fff;padding:46px 30px;display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center;overflow:hidden;position:relative}
.hero:before{content:"";position:absolute;width:420px;height:420px;right:-120px;top:-160px;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 65%)}
.hero h1{font-size:clamp(34px,6vw,60px);margin:.1em 0}.hero p{opacity:.9;max-width:480px}
.eye{letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:700;color:var(--gd)}
.hero .eye{color:#f5d27a}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px}.stats div{font-size:13px;opacity:.85}.stats b{display:block;font:800 30px Fraunces,Georgia,serif;opacity:1}
.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:9px 16px;border-radius:12px;cursor:pointer;font:600 14px Inter,system-ui,sans-serif;text-decoration:none;display:inline-block;transition:.2s}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.hero .btn.p{background:#fff;color:#2a1670;border-color:#fff}.btn:hover{transform:translateY(-2px)}
.sec{margin-top:46px}.sec h2{font-size:clamp(26px,4vw,36px);margin:.1em 0 .4em}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:20px 22px;margin:14px 0;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.grid .card{margin:0}
a.card{display:block;text-decoration:none;color:inherit;transition:.25s}a.card:hover{transform:translateY(-5px);border-color:var(--ac)}
.fig{display:flex;flex-direction:column;align-items:center;text-align:center}.fig svg{width:100%;max-width:340px;height:auto}.fig small{color:var(--mu);margin-top:6px}
svg .a{fill:var(--ac)}svg .b{fill:var(--ac2)}svg .g{fill:var(--gd)}svg .l{fill:none;stroke:var(--tx);stroke-width:3;stroke-linecap:round}svg .s{fill:var(--sf);stroke:var(--bd);stroke-width:2}svg text{fill:var(--tx);font:600 11px Inter,sans-serif;text-anchor:middle}svg .w{fill:#fff}
.beam{transform-origin:100px 60px;animation:tilt 5s ease-in-out infinite}@keyframes tilt{50%{transform:rotate(-7deg)}0%,100%{transform:rotate(7deg)}}
.tag{display:inline-block;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);border-radius:99px;padding:1px 11px;font-size:12px;font-weight:700;margin:1px}
.tl{display:flex;gap:0;overflow-x:auto;padding:10px 0}.tl div{min-width:150px;flex:1;padding:36px 10px 0;position:relative;font-size:13px;border-top:3px solid var(--ac)}.tl div:before{content:"";position:absolute;top:-9px;left:10px;width:15px;height:15px;border-radius:50%;background:var(--gd);border:3px solid var(--bg)}.tl b{display:block;color:var(--ac);font-size:14px}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font:800 26px Fraunces,Georgia,serif}.eq span{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:10px 18px;font:700 15px Inter,sans-serif;text-align:center}.eq span.r{background:var(--ac);color:#fff}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--bd);padding:10px;text-align:left;vertical-align:top}th{color:var(--ac);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.tabs .btn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
details{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 18px;margin:10px 0}summary{cursor:pointer;font-weight:700}
.fc{perspective:900px;height:220px;cursor:pointer;margin:16px 0}.fc div{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}.fc.f div{transform:rotateY(180deg)}
.fc span{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;border-radius:22px;border:1px solid var(--bd);background:var(--sf);font:700 24px Fraunces,Georgia,serif;box-shadow:var(--sh)}.fc span+span{transform:rotateY(180deg);background:var(--hero);color:#fff;font:500 17px Inter,sans-serif}
.opt{display:block;width:100%;text-align:left;margin:8px 0}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--sf))}.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 16%,var(--sf))}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
.mu{color:var(--mu);font-size:14px}.rv{opacity:0;transform:translateY(24px);transition:.7s}.rv.in{opacity:1;transform:none}
@media(max-width:700px){.hero{grid-template-columns:1fr;padding:32px 20px}.hero .fig{order:-1}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<script>
const P=[["home","Home"],["crime","Crime"],["criminology","Criminology"],["schools","Schools"],["exam","Essays"],["quiz","Quiz"],["cards","Cards"]];
let tab=0,qi=0,score=0,ans=false,ci=0,fl=false;
const T=(h,r)=>`<div class="scroll"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const F=(s,c)=>`<div class="card fig">${s}<small>${c}</small></div>`;
const SC=`<svg viewBox="0 0 200 190"><path class="l" d="M100 20v140M60 165h80" stroke="#fff" style="stroke:#fff"/><g class="beam"><path d="M30 60h140" style="stroke:#f5d27a;stroke-width:5;stroke-linecap:round"/><path d="M30 60l-18 55h36zM170 60l-18 55h36z" style="fill:none;stroke:#fff;stroke-width:2"/><path d="M8 115h44a22 12 0 0 1-44 0zM148 115h44a22 12 0 0 1-44 0z" style="fill:#f5d27a"/></g><circle cx="100" cy="20" r="8" style="fill:#f5d27a"/></svg>`;
const SEE=`<svg viewBox="0 0 300 170"><g class="beam" style="transform-origin:150px 70px;animation-duration:6s"><rect x="30" y="66" width="240" height="8" rx="4" class="a"/><rect x="40" y="26" width="70" height="40" rx="8" class="b"/><text x="75" y="51" class="w">BENEFIT</text><rect x="190" y="38" width="70" height="28" rx="8" class="g"/><text x="225" y="57">COST</text></g><path class="l" d="M150 74v70M110 150h80"/><text x="150" y="14">Crime when benefit &gt; cost</text></svg>`;
const BODY=`<svg viewBox="0 0 300 150">${[[50,13,"Ectomorph","lean"],[150,22,"Mesomorph","muscular"],[250,32,"Endomorph","rounded"]].map(([x,w,n,d])=>`<circle cx="${x}" cy="22" r="12" class="a"/><rect x="${x-w}" y="38" width="${w*2}" height="62" rx="${w}" class="b"/><rect x="${x-w/2.5}" y="98" width="${w/1.2}" height="32" rx="6" class="a"/><text x="${x}" y="146">${n}</text>`).join("")}</svg>`;
const TWIN=`<svg viewBox="0 0 300 140"><ellipse cx="75" cy="52" rx="60" ry="40" class="s"/><circle cx="55" cy="52" r="14" class="a"/><circle cx="95" cy="52" r="14" class="a"/><text x="75" y="115">Identical: 1 egg, 1 sperm</text><ellipse cx="225" cy="52" rx="60" ry="40" class="s"/><circle cx="205" cy="52" r="14" class="a"/><circle cx="245" cy="52" r="14" class="b"/><text x="225" y="115">Fraternal: 2 eggs, 2 sperm</text></svg>`;
const VEN=`<svg viewBox="0 0 300 190"><circle cx="110" cy="80" r="62" class="a" opacity=".55"/><circle cx="190" cy="80" r="62" class="b" opacity=".55"/><circle cx="150" cy="130" r="62" class="g" opacity=".55"/><text x="82" y="62">CRIME</text><text x="82" y="76">law</text><text x="218" y="62">SIN</text><text x="218" y="76">religion</text><text x="150" y="150">IMMORALITY</text><text x="150" y="164">social norms</text></svg>`;
const ZONE=`<svg viewBox="0 0 300 190"><circle cx="150" cy="95" r="88" class="s"/><circle cx="150" cy="95" r="66" class="b" opacity=".35"/><circle cx="150" cy="95" r="44" class="g" opacity=".6"/><circle cx="150" cy="95" r="22" class="a"/><text x="150" y="99" class="w">Centre</text><text x="150" y="60">Delinquency area</text><text x="150" y="38">Stable residential</text></svg>`;
const EQ=`<div class="card"><div class="eq"><span>🏃 Actus reus<br><small>guilty act</small></span>+<span>🧠 Mens rea<br><small>guilty mind</small></span>=<span class="r">CRIME</span></div></div>`;
const schools=[
["Pre-classical","<p>Crime explained by <b>demonology, witchcraft, supernatural powers</b>. Offenders were thought influenced by evil spirits; remedies were worship, sacrifice, <b>trial by ordeal</b> (water, fire) and torture by priests. It faded as reformers (Hobbes, Locke, St Thomas, Luther) challenged ordeals.</p>"],
["Classical",F(SEE,"Rational choice: weighing benefit against cost")+"<p>18th-century reaction to arbitrary justice; crime violates the <b>social contract</b>. <span class='tag'>Beccaria</span> free will, proportionate and swift punishment. <span class='tag'>Bentham</span> pain–pleasure principle.</p><ul><li>Free, rational, hedonistic humans.</li><li>Equal punishment, no cruel or arbitrary bias.</li><li>Aim is <b>deterrence</b>; opposed the death penalty.</li></ul><p><b>Critique:</b> ignores socio-economic factors and individual differences, offers no rehabilitation, focuses on law rather than crime control.</p>"],
["Biological",F(BODY,"Somatotypes: body types linked to temperament")+F(TWIN,"Twin studies separate heredity from environment")+"<p>Positivists reject free will for <b>determinism</b>. <span class='tag'>Lombroso</span> <span class='tag'>Ferri</span> <span class='tag'>Garofalo</span></p><ul><li>“Born” criminal type; <b>atavism and degeneracy</b>.</li><li>Physical traits: asymmetrical face, large ears, long arms, flat nose, retreating forehead.</li><li>Crime = personality × environment.</li><li>Treatment over punishment: <b>indeterminate sentences, incapacitation, forced sterilisation</b>.</li></ul><p><b>Limits:</b> overgeneralisation, no crime gene, ignores society, stigmatises.</p>"],
["Psychological","<p>Personality defects, feeble-mindedness, mental disorder, undeveloped ego.</p>"+T(["Theory","Cause"],[["Psychodynamic (Freud)","Id–ego–superego, Oedipal conflict, death instinct"],["Behavioural / social learning","Imitation, observation, reward and punishment"],["Cognitive","Faulty decisions, weak moral reasoning, rationalising"],["Personality (Eysenck)","Extraversion, neuroticism, psychoticism"],["Intelligence","Low IQ, poor schooling"]])+"<p>Behaviour can be modified by counselling, education and treatment.</p>"],
["Economic","<p><span class='tag'>Becker</span> crime when expected benefits exceed costs. <span class='tag'>Fornasari 1894</span> 85–90% of Italian criminals poor: a “climate of motivation”. <span class='tag'>Bonger</span> capitalism breeds egoism, less altruism. <span class='tag'>Marxian</span> gap between effort and reward, class inequality, competition.</p><p><b>Limits:</b> monolithic, oversimplified.</p>"],
["Geographical","<p><span class='tag'>Montesquieu</span> <span class='tag'>Quetelet</span> <span class='tag'>Guerry</span> <span class='tag'>Dexter</span> <span class='tag'>Kropotkin</span>: climate, regions, cities shape crime.</p><ul><li>Unequal distribution; surroundings create opportunity.</li><li>Urbanisation, overcrowding, weak surveillance.</li><li>Prevention: lighting, surveillance, design.</li></ul>"],
["Sociological",F(ZONE,"Illustrative concentric-zone model of delinquency areas")+"<p>Rejects inheritance; crime is <b>learned</b>. Four approaches: social disorganisation, structural, processual, sub-cultural.</p>"+T(["Theory","Core idea","Lecture example"],[["Social disorganisation","Congestion, poor housing, weak control","Mohammadpur–Bihari colony"],["Differential association (Sutherland)","Learned in intimate groups; frequency, duration, priority, intensity","Dowry, stealing, exam cheating"],["Anomie","Normlessness, little moral guidance","Mob violence, vandalism, arson"],["Strain (Merton)","Blocked goals → illegitimate means","Bribery, theft, embezzlement"],["Labelling (Becker)","Deviance is a social label","—"]])]];
const pages={
home:()=>`<div class="hero"><div><div class="eye">In-course exam companion</div><h1>Crime &amp; Criminality</h1><p>Concepts, theories, illustrated diagrams, model essays and practice, built from your lectures.</p><a class="btn p" href="#schools">Start revising →</a><div class="stats"><div><b>7</b>schools</div><div><b>12</b>quiz questions</div><div><b>16</b>flashcards</div><div><b>4</b>essay plans</div></div></div><div class="fig">${SC}</div></div>
<div class="sec rv"><div class="eye">Roadmap</div><h2>Choose your path</h2><div class="grid">${[["crime","⚖️","Crime","Definitions, actus reus, types"],["criminology","🔬","Criminology","Science, evolution, perspectives"],["schools","🧠","Schools","Classical to sociological"],["exam","✍️","Essays","4-page answer plans"],["quiz","🎯","Quiz","Test yourself"],["cards","🃏","Cards","Flip and memorise"]].map(x=>`<a class="card" href="#${x[0]}"><div style="font-size:30px">${x[1]}</div><b>${x[2]}</b><div class="mu">${x[3]}</div></a>`).join("")}</div></div>
<div class="sec rv"><div class="eye">Evolution of thought</div><h2>Timeline of schools</h2><div class="card tl"><div><b>Pre-classical</b>Demonology, ordeals</div><div><b>18th c. Classical</b>Beccaria, Bentham</div><div><b>19th c. Positivist</b>Lombroso, Ferri</div><div><b>Sociological</b>Differential association, strain</div><div><b>1940–90</b>Liberal, radical, conservative</div></div></div>
<div class="card rv"><b>Exam plan:</b> answer 2 of 3, about 4 pages each. Structure: definition → thinkers with years → 4–6 developed points → critique → conclusion.</div>`,
crime:()=>`<div class="sec"><div class="eye">Unit 1</div><h2>What is crime?</h2></div>
<div class="card rv">Latin <i>crimen</i>: fault, offence, guilt. <b>Tannenbaum:</b> crime is as eternal as society. <b>Alfieri:</b> society prepares crimes, the criminal commits them. <b>Quinney:</b> crime reflects the material and spiritual conditions of society. Crime is <b>relative</b> across societies (Section 377 example in the lecture).</div>
<div class="grid rv"><div class="card"><h3>Social definitions</h3><ul><li><b>Sellin 1970:</b> violation of group conduct norms</li><li><b>Caldwell 1956:</b> act detrimental to society, handled by organised procedures</li><li><b>Clinard 1957:</b> tolerated, mildly or strongly disapproved; the last is crime</li><li><b>Strain theorists:</b> crime is dysfunctional</li></ul></div><div class="card"><h3>Legal definitions</h3><ul><li><b>Tappon 1960:</b> intentional act or omission, no justification, state-sanctioned</li><li><b>Hall Jerome 1947:</b> forbidden, harmful, criminal intent, prescribed punishment</li><li><b>Marxists / Becker:</b> law as social creation; labelling</li></ul></div></div>
<div class="sec rv"><h2>Actus reus + mens rea</h2>${EQ}<p><b>Defences:</b> involuntary conduct, factual disputes, lack of intent, intoxication and mental health. Mens rea includes intention, knowledge, recklessness, negligence.</p></div>
<div class="sec rv"><h2>Crime vs sin vs immorality</h2><div class="grid">${F(VEN,"Three overlapping systems of rules")}<div class="card">${T(["","Crime","Sin","Immoral"],[["By","Law","Faith","Norms"],["Punish","Physical","Earthly + hereafter","Scolding, isolation"],["E.g.","Homicide, trafficking","Usury, abortion","Public urination"]])}</div></div></div>
<div class="sec rv"><h2>Types and significance</h2><div class="card"><b>Clinard &amp; Quinney 1967:</b> <span class="tag">Violent personal</span><span class="tag">Occasional property</span><span class="tag">Occupational</span><span class="tag">Political</span><span class="tag">Public order</span><span class="tag">Conventional</span></div><div class="card"><b>Significance:</b> fear and loss of life and property · public fascination · costly · erodes morale · reflects social ills · stigmatises offenders and recidivists.</div></div>`,
criminology:()=>`<div class="sec"><div class="eye">Unit 2</div><h2>Criminology</h2></div>
<div class="card rv"><b>Bloch &amp; Geis:</b> science of crime as a social phenomenon. <b>Sutherland:</b> making laws, breaking laws, reacting to law-breaking. <b>Penology:</b> the punitive branch.</div>
<div class="grid rv"><div class="card"><h3>Traft’s 4 divisions</h3>${["Explanation of crime","Detection of crime","Prevention","Punishment and treatment"].map((x,i)=>`<p><span class="tag">${i+1}</span> ${x}</p>`).join("")}</div><div class="card"><h3>A science</h3><p>Verifiable evidence, accurate, systematic, objective, controlled conditions, theory and research. Draws on <b>biology, psychology, sociology</b>.</p></div></div>
<div class="sec rv"><h2>Evolution</h2><div class="card tl"><div><b>1879</b>Topinard coins “criminologie”</div><div><b>18–19th c.</b>Reform of criminal law</div><div><b>1920</b>Parmelee’s textbook, USA</div><div><b>1940</b>Teaching at Lucknow</div><div><b>1949</b>Lucknow diploma</div></div></div>
<div class="sec rv"><h2>Gibbons &amp; Garabedian (1974)</h2><div class="card">${T(["","Liberal 1940–50","Radical 1960–70","Conservative 1970–90"],[["Cause","Criminogenic environment, inequality","Exploitative capitalism","Morally defective; many factors"],["Response","Rehabilitation","Change the system","Deterrence, enforcement"]])}</div></div>`,
schools:()=>`<div class="sec"><div class="eye">Unit 3</div><h2>Schools &amp; theories</h2></div><div class="tabs">${schools.map((s,i)=>`<button class="btn ${i==tab?"on":""}" onclick="tab=${i};render()">${s[0]}</button>`).join("")}</div><div class="card rv">${schools[tab][1]}</div>`,
exam:()=>`<div class="sec"><div class="eye">Exam practice</div><h2>Model essay plans</h2><p class="mu">Each fits about 4 pages: intro, three body sections, critique and conclusion.</p></div>${[["Define crime: legal and social definitions","Intro (crimen, eternal, relative) → legal: Tappon, Hall → actus reus and mens rea, defences → social: Sellin, Caldwell, Clinard, Marxist, labelling → crime vs sin vs immorality → significance and conclusion."],["Criminology: meaning, evolution, perspectives","Definitions (Bloch &amp; Geis, Sutherland, penology) → Traft’s divisions and science → evolution (1879, 1920, 1940/49) → liberal, radical, conservative table → conclusion."],["Critically discuss the schools of criminology","Pre-classical → classical → positivist (biological, psychological) → economic, geographical → sociological with examples → critique of each → integrated view."],["Sociological theories with examples","Four approaches → disorganisation → differential association → anomie and strain → labelling → local examples → limits and policy."]].map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join("")}`,
quiz:()=>{const Q=QZ[qi];if(!Q)return`<div class="sec"><h2>Finished 🎉</h2></div><div class="card"><h2>${score} / ${QZ.length}</h2><button class="btn p" onclick="qi=0;score=0;ans=false;render()">Retry</button></div>`;
return`<div class="sec"><div class="eye">Question ${qi+1} / ${QZ.length} · Score ${score}</div><div class="bar"><i style="width:${qi/QZ.length*100}%"></i></div></div><div class="card"><h3>${Q[0]}</h3>${Q[1].map((o,i)=>`<button class="btn opt ${ans!==false?(i==Q[2]?"ok":(i==ans?"no":"")):""}" ${ans!==false?"disabled":""} onclick="pick(${i})">${o}</button>`).join("")}${ans!==false?`<p>${ans==Q[2]?"✅ Correct.":"❌ Not quite."} ${Q[3]}</p><button class="btn p" onclick="qi++;ans=false;render()">Next →</button>`:""}</div>`},
cards:()=>{const c=FC[ci];return`<div class="sec"><div class="eye">Card ${ci+1} / ${FC.length}</div><h2>Flashcards</h2></div><div class="fc ${fl?"f":""}" onclick="fl=!fl;render()"><div><span>${c[0]}</span><span>${c[1]}</span></div></div><button class="btn" onclick="ci=(ci+FC.length-1)%FC.length;fl=false;render()">← Prev</button> <button class="btn p" onclick="ci=(ci+1)%FC.length;fl=false;render()">Next →</button> <button class="btn" onclick="ci=Math.floor(Math.random()*FC.length);fl=false;render()">Shuffle</button>`}};

document.querySelectorAll(".rv").forEach(n=>io.observe(n))}
